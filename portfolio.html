<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script src="./js/jquery_3.7.1.js"></script>
    <script type="text/javascript" src="./js/modernizr.2.5.3.min.js"></script>
    <script type="text/javascript" src="./js/hash.js"></script>
    <style>
        #flipbook{height: auto !important; aspect-ratio: 545/394; }
        #flipbook div{height: auto !important; aspect-ratio: 272/394 !important; width: 100% !important; }
        #flipbook > div{height: auto !important; aspect-ratio: 272/394 !important; width: 50% !important; }
        #flipbook {margin: 5% auto; }
        #flipbook .turn-page {-webkit-background-size: 100% 100%; background-size: 100% 100%; }
        #flipbook div {-webkit-background-size: cover; background-size: cover; background-position: center center; }
    </style>
</head>
<body>
    <div id="canvas">
        <div class="zoom-icon zoom-icon-in"></div>
        <div class="magazine-viewport">
            <div class="container">
                <div class="magazine">
                    <!-- Next button -->
                    <div ignore="1" class="next-button"></div>
                    <!-- Previous button -->
                    <div ignore="1" class="previous-button"></div>
                </div>
            </div>
        </div>
    <!-- Thumbnails -->
        <div class="thumbnails">
            <div>
                <ul>
                    <li class="i"><img class="page-1" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_1.png" /> <span>1</span></li>
                    <li class="d"><img class="page-2" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_2.png" /> <img class="page-3" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_3.png" /> <span>2/3</span></li>
                    <li class="d"><img class="page-4" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_4.png" /> <img class="page-5" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_5.png" /> <span>4/5</span></li>
                    <li class="d"><img class="page-6" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_6.png" /> <img class="page-7" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_7.png" /> <span>6/7</span></li>
                    <li class="d"><img class="page-8" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_8.png" /> <img class="page-9" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_9.png" /> <span>8/9</span></li>
                    <li class="d"><img class="page-10" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_10.png" /> <img class="page-11" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_11.png" /> <span>10/11</span></li>
                    <li class="d"><img class="page-12" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_12.png" /> <img class="page-13" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_13.png" /> <span>12/13</span></li>
                    <li class="d"><img class="page-14" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_14.png" /> <img class="page-15" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_15.png" /> <span>14/15</span></li>
                    <li class="d"><img class="page-16" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_16.png" /> <img class="page-17" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_17.png" /> <span>16/17</span></li>
                    <li class="d"><img class="page-18" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_18.png" /> <img class="page-19" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_19.png" /> <span>18/19</span></li>
                    <li class="d"><img class="page-20" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_20.png" /> <img class="page-21" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_21.png" /> <span>20/21</span></li>
                    <li class="i"><img class="page-22" src="https://raw.githubusercontent.com/sksrla8860/paper/gh-pages/image/portfolio_01_22.png" /> <span>22</span></li>
                <ul>
            </div>	
        </div>
    </div>
    <script>
        function loadApp() {

            $('#canvas').fadeIn(1000);

            var flipbook = $('.magazine');

            // Check if the CSS was already loaded

            if (flipbook.width()==0 || flipbook.height()==0) {
                setTimeout(loadApp, 10);
                return;
            }

            // Create the flipbook

            flipbook.turn({

                    // Magazine width

                    width: 922,

                    // Magazine height

                    height: 600,

                    // Duration in millisecond

                    duration: 1000,

                    // Hardware acceleration

                    acceleration: !isChrome(),

                    // Enables gradients

                    gradients: true,

                    // Auto center this flipbook

                    autoCenter: true,

                    // Elevation from the edge of the flipbook when turning a page

                    elevation: 50,

                    // The number of pages

                    pages: 12,

                    // Events

                    when: {
                        turning: function(event, page, view) {

                            var book = $(this),
                            currentPage = book.turn('page'),
                            pages = book.turn('pages');

                            // Update the current URI

                            Hash.go('page/' + page).update();

                            // Show and hide navigation buttons

                            disableControls(page);


                            $('.thumbnails .page-'+currentPage).
                                parent().
                                removeClass('current');

                            $('.thumbnails .page-'+page).
                                parent().
                                addClass('current');



                        },

                        turned: function(event, page, view) {

                            disableControls(page);

                            $(this).turn('center');

                            if (page==1) { 
                                $(this).turn('peel', 'br');
                            }

                        },

                        missing: function (event, pages) {

                            // Add pages that aren't in the magazine

                            for (var i = 0; i < pages.length; i++)
                                addPage(pages[i], $(this));

                        }
                    }

            });

            // Zoom.js

            $('.magazine-viewport').zoom({
                flipbook: $('.magazine'),

                max: function() { 

                    return largeMagazineWidth()/$('.magazine').width();

                }, 

                when: {

                    swipeLeft: function() {

                        $(this).zoom('flipbook').turn('next');

                    },

                    swipeRight: function() {

                        $(this).zoom('flipbook').turn('previous');

                    },

                    resize: function(event, scale, page, pageElement) {

                        if (scale==1)
                            loadSmallPage(page, pageElement);
                        else
                            loadLargePage(page, pageElement);

                    },

                    zoomIn: function () {

                        $('.thumbnails').hide();
                        $('.made').hide();
                        $('.magazine').removeClass('animated').addClass('zoom-in');
                        $('.zoom-icon').removeClass('zoom-icon-in').addClass('zoom-icon-out');

                        if (!window.escTip && !$.isTouch) {
                            escTip = true;

                            $('<div />', {'class': 'exit-message'}).
                                html('<div>Press ESC to exit</div>').
                                    appendTo($('body')).
                                    delay(2000).
                                    animate({opacity:0}, 500, function() {
                                        $(this).remove();
                                    });
                        }
                    },

                    zoomOut: function () {

                        $('.exit-message').hide();
                        $('.thumbnails').fadeIn();
                        $('.made').fadeIn();
                        $('.zoom-icon').removeClass('zoom-icon-out').addClass('zoom-icon-in');

                        setTimeout(function(){
                            $('.magazine').addClass('animated').removeClass('zoom-in');
                            resizeViewport();
                        }, 0);

                    }
                }
            });

            // Zoom event

            if ($.isTouch)
                $('.magazine-viewport').bind('zoom.doubleTap', zoomTo);
            else
                $('.magazine-viewport').bind('zoom.tap', zoomTo);


            // Using arrow keys to turn the page

            $(document).keydown(function(e){

                var previous = 37, next = 39, esc = 27;

                switch (e.keyCode) {
                    case previous:

                        // left arrow
                        $('.magazine').turn('previous');
                        e.preventDefault();

                    break;
                    case next:

                        //right arrow
                        $('.magazine').turn('next');
                        e.preventDefault();

                    break;
                    case esc:

                        $('.magazine-viewport').zoom('zoomOut');	
                        e.preventDefault();

                    break;
                }
            });

            // URIs - Format #/page/1 

            Hash.on('^page\/([0-9]*)$', {
                yep: function(path, parts) {
                    var page = parts[1];

                    if (page!==undefined) {
                        if ($('.magazine').turn('is'))
                            $('.magazine').turn('page', page);
                    }

                },
                nop: function(path) {

                    if ($('.magazine').turn('is'))
                        $('.magazine').turn('page', 1);
                }
            });


            $(window).resize(function() {
                resizeViewport();
            }).bind('orientationchange', function() {
                resizeViewport();
            });

            // Events for thumbnails

            $('.thumbnails').click(function(event) {

                var page;

                if (event.target && (page=/page-([0-9]+)/.exec($(event.target).attr('class'))) ) {

                    $('.magazine').turn('page', page[1]);
                }
            });

            $('.thumbnails li').
                bind($.mouseEvents.over, function() {

                    $(this).addClass('thumb-hover');

                }).bind($.mouseEvents.out, function() {

                    $(this).removeClass('thumb-hover');

                });

            if ($.isTouch) {

                $('.thumbnails').
                    addClass('thumbanils-touch').
                    bind($.mouseEvents.move, function(event) {
                        event.preventDefault();
                    });

            } else {

                $('.thumbnails ul').mouseover(function() {

                    $('.thumbnails').addClass('thumbnails-hover');

                }).mousedown(function() {

                    return false;

                }).mouseout(function() {

                    $('.thumbnails').removeClass('thumbnails-hover');

                });

            }


            // Regions

            if ($.isTouch) {
                $('.magazine').bind('touchstart', regionClick);
            } else {
                $('.magazine').click(regionClick);
            }

            // Events for the next button

            $('.next-button').bind($.mouseEvents.over, function() {

                $(this).addClass('next-button-hover');

            }).bind($.mouseEvents.out, function() {

                $(this).removeClass('next-button-hover');

            }).bind($.mouseEvents.down, function() {

                $(this).addClass('next-button-down');

            }).bind($.mouseEvents.up, function() {

                $(this).removeClass('next-button-down');

            }).click(function() {

                $('.magazine').turn('next');

            });

            // Events for the next button

            $('.previous-button').bind($.mouseEvents.over, function() {

                $(this).addClass('previous-button-hover');

            }).bind($.mouseEvents.out, function() {

                $(this).removeClass('previous-button-hover');

            }).bind($.mouseEvents.down, function() {

                $(this).addClass('previous-button-down');

            }).bind($.mouseEvents.up, function() {

                $(this).removeClass('previous-button-down');

            }).click(function() {

                $('.magazine').turn('previous');

            });


            resizeViewport();

            $('.magazine').addClass('animated');

        }

        // Zoom icon

         $('.zoom-icon').bind('mouseover', function() { 

            if ($(this).hasClass('zoom-icon-in'))
                $(this).addClass('zoom-icon-in-hover');

            if ($(this).hasClass('zoom-icon-out'))
                $(this).addClass('zoom-icon-out-hover');

         }).bind('mouseout', function() { 

             if ($(this).hasClass('zoom-icon-in'))
                $(this).removeClass('zoom-icon-in-hover');

            if ($(this).hasClass('zoom-icon-out'))
                $(this).removeClass('zoom-icon-out-hover');

         }).bind('click', function() {

            if ($(this).hasClass('zoom-icon-in'))
                $('.magazine-viewport').zoom('zoomIn');
            else if ($(this).hasClass('zoom-icon-out'))	
                $('.magazine-viewport').zoom('zoomOut');

         });

         $('#canvas').hide();


        // Load the HTML4 version if there's not CSS transform

        yepnope({
            test : Modernizr.csstransforms,
            yep: ['./js/turn.js'],
            nope: ['./js/turn.html4.min.js'],
            both: ['./js/zoom.min.js', './js/magazine.js', './css/magazine.css'],
            complete: loadApp
        });

    </script>
</body>
</html>
